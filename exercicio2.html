<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de compras</title>
    <script>
        window.onload = inicio;
        let listaItens = [];
        let listaComprado =[];

        function inicio() {
            let botao = document.getElementById('btnAdiciona');
            botao.addEventListener('click', adicionar);

            let botaoRemover = document.getElementById('btnRemove');
            botaoRemover.addEventListener('click', remover);
        }

        function adicionar() {
            let campoItem = document.getElementById('item');
            let texto = campoItem.value;

    
            listaItens.push([false, texto]);
            atualizar();

            campoItem.value = '';
        }

        function atualizar() {
            let lista = document.getElementById('listaAComprar');
            lista.innerHTML = "";

            let listac = document.getElementById('listaComprados');
            listac.innerHTML = "";

            for (let i = 0; i < listaItens.length; i++) {
                lista.innerHTML += `<li>${listaItens[i][1]}</li>`;
            }

            for (let i = 0; i < listaComprado.length; i++) {
                listac.innerHTML += `<li>${listaComprado[i][1]}</li>`;
            }
        }

        function remover() {
            let campoComprar = document.getElementById('num');
            let indiceComprado = Number(campoComprar.value) - 1;


            if(indiceComprado >= listaItens.length || indiceComprado < 0) {
                console.log('Índice inválido');
                return;
            } 

            let itemComprado = listaItens.splice(indiceComprado, 1);

            listaComprado.push(itemComprado[0]);

            atualizar();

            campoComprar.value = '';
        }

    </script>
</head>

<body>
    <label for="">Item:</label>
    <input type="text" id="item"><br>
    <button id="btnAdiciona">Adicionar</button>

    <h2>Comprar:</h2>
    <ol id="listaAComprar"></ol>

    <label for="">Remover:</label>
    <input type="number" id="num"><br>
    <button id="btnRemove">Remover</button>

    <h2>Comprado:</h2>
    <ul id="listaComprados"></ul>
</body>

</html>
