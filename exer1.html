<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista</title>

    <script>
        window.onload = inicio;

        function inicio() {
            let lista = document.getElementById('lista');
            let btn_add = document.getElementById('btnAdiciona');

            btn_add.addEventListener('click', adicionarLista);

        }

        function adicionarLista() {
            let coisa = document.getElementById('item');
            let valor = coisa.value;
            lista.innerHTML += `<li>${valor}</li>`;

            let totalListaItens = document.getElementById('totalItemLista');
            let total = lista.children.length;
            totalListaItens.innerHTML = `Total de itens: ${total}`;
            
            coisa.value = '';
        }
    </script>

</head>



<body>
    <label for="">Item:</label>
    <input type="text" id="item"><br>
    <button id="btnAdiciona">Adicionar</button>
    <ul id="lista"></ul>
    <p id="totalItemLista">Total de itens: 0</p>
</body>
</html>
